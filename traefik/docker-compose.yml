name: traefik
services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    networks:
      - traefik-proxy
    container_name: traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./le:/le
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.middlewares.traefik-secure.redirectscheme.scheme=https
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.middlewares=traefik-secure@docker
      - traefik.http.routers.traefik.rule=Host(`traefik.example-domain.ru`) # example-domain.ru поменять на свой домен, который привязан к серверу 
      - traefik.http.routers.traefik-secure.entrypoints=websecure
      - traefik.http.routers.traefik-secure.rule=Host(`traefik.example-domain.ru`) # example-domain.ru поменять на свой домен, который привязан к серверу 
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-secure.tls.certresolver=le
      - traefik.http.services.traefik.loadbalancer.server.port=8080

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
